name: Verify CloudBeaver Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v26.2.4
permissions:
  contents: read
concurrency:
  group: cloudbeaver-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.cloudbeaver-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.cloudbeaver', info['package']
              assert info['name'] == 'CloudBeaver', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'Apache-2.0', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              m = yaml.safe_load(package.extractfile('manifest.yml').read())
              app = m['application']
              assert app['subdomain'] == 'cloudbeaver', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and u['backend'] == 'http://cloudbeaver:8978/' for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'cloudbeaver'}, set(svcs)

              svc = svcs['cloudbeaver']
              assert 'dbeaver/cloudbeaver' in svc['image'], svc['image']
              assert svc['image'].endswith(':' + tag.lstrip('v')), svc['image']

              # the workspace holds the admin account and saved connections;
              # without a persistent mount the setup wizard runs again on restart
              binds = svc['binds']
              ws = [b for b in binds if b.endswith(':/opt/cloudbeaver/workspace')]
              assert ws, binds
              assert ws[0].startswith('/lzcapp/var/'), ws[0]

              # no built-in credential: account comes from the first-run wizard,
              # so no admin deploy params should exist
              assert 'deploy_params.yml' not in members, members

              assert 'healthcheck' not in svc, svc
              text = package.extractfile('manifest.yml').read().decode()
              assert 'lzc-file-chooser' not in text

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
              assert 'Apache License' in license_text and 'Version 2.0' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
